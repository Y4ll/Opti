plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.androidoptimizer.noroot'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.androidoptimizer.noroot'
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName '2.3'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
