name: SDK tools

on:
  push:
    paths:
      - '.github/workflows/sdk-tools.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Exportar android.jar
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          mkdir -p out
          P="$ANDROID_HOME/platforms/android-34"
          [ -d "$P" ] || P="$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -1)"
          echo "usando $P"
          cp "$P/android.jar" out/android.jar
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: android-jar
          path: out/android.jar
          retention-days: 30
      - name: Publicar pre-release temporal
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tools-tmp
          name: tools-tmp
          prerelease: true
          make_latest: false
          files: out/android.jar
