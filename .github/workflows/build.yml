name: Build APKs

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar Lite (sin root)
        run: gradle -p lite assembleDebug --no-daemon

      - name: Compilar Root
        run: gradle -p root assembleDebug --no-daemon

      - name: Reunir archivos
        run: |
          mkdir out
          cp lite/app/build/outputs/apk/debug/app-debug.apk out/AndroidOptimizer-Lite.apk
          cp root/app/build/outputs/apk/debug/app-debug.apk out/AndroidOptimizer-Root.apk
          (cd magisk && zip -qr ../out/AndroidOptimizer-Magisk.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: android-optimizer
          path: out/*

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Android Optimizer build ${{ github.run_number }}
          make_latest: true
          files: out/*
